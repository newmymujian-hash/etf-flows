name: daily-update
on:
  schedule:
    - cron: "30 1 * * 2-6"   # 北京时间 09:30（周二至周六），交易所T+1早间正式份额
    - cron: "0 13 * * 1-5"   # UTC 13:00，补抓美股发行商前一日数据
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
