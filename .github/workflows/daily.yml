name: daily-update
on:
  schedule:
    - cron: "0 12 * * 1-5"    # A股：北京时间 20:00，收盘后交易所份额已发布
    - cron: "30 23 * * 1-5"   # 美股：美东 18:30（冬令时），收盘后发行商数据已发布
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
