name: daily-update
on:
  schedule:
    # GitHub 定时任务常延迟数小时，所以多排几次；数据没变就不提交
    - cron: "17 1,4,7,10,13,16,19,22 * * 1-6"   # 每 3 小时一次（周一至周六 UTC）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
